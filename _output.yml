bookdown::gitbook:
  css: custom.css
  split_by: chapter
  number_sections: false
  includes:
    after_body: book-ui.html
  config:
    toc:
      collapse: none
      toc_depth: 3
      before: |
        <li><strong>Predicción de Bancarrota Empresarial</strong></li>
      after: |
        <li><a href="https://github.com/lauraformore" target="_blank">Universidad del Norte</a></li>
    download: no
    sharing:
      facebook: no
      twitter: no
      
